<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Sederhana Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Selamat Datang!</h1>
        <p>Ini adalah website sederhana yang di-host gratis di GitHub Pages.</p>
        <button onclick="sapaan()">Klik Saya</button>
        <p id="pesan"></p>
    </div>

    <script>
        function sapaan() {
            document.getElementById("pesan").innerText = "Halo! Terima kasih sudah berkunjung.";
        }
    </script>
</body>
</html>
